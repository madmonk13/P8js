<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="P8js">
  <title>P8js</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="screen2d" width="128" height="128"></canvas>

  <!-- Full-screen touch surface: the d-pad half, and the button half with X
     over O (main.js places the split and the zone outlines). -->
  <div id="surface">
    <div class="zone joy">
      <div class="box stick"><b>D-pad</b><small>Drag</small></div>
      <div class="hint"><b>D-pad</b><span>Touch &amp; drag on this side</span></div>
    </div>
    <div class="zone fire">
      <div class="box a"><b>X</b><small>Tap</small></div>
      <div class="box b"><b>O</b><small>Tap</small></div>
      <div class="hint"><b id="hintXO">X · O</b><span id="hintXOText">Top half is X, bottom half is O</span></div>
    </div>
  </div>
  <div id="ripples"></div>
  <div id="dpad">
    <i class="arrow up"></i><i class="arrow right"></i><i class="arrow down"></i><i class="arrow left"></i>
    <div class="knob"></div>
  </div>

  <header id="bar">
    <button id="menuBtn" class="icon" aria-label="Settings"><span class="face">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
    </button>
    <button id="pauseBtn" class="icon" aria-label="Pause" aria-pressed="false"><span class="face"><svg class="i-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="i-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></span></button>
    <button id="cartBtn" class="pill"><span class="face">Cart</span></button>
  </header>

  <!-- Shown while the game is paused; tapping it resumes. -->
  <div id="paused" hidden><div class="card"><b>Paused</b><span id="pausedGame" class="game"></span><span>Tap to resume</span></div></div>

  <!-- A game started from power-on (not resumed from a save) says so for a few seconds; tapping dismisses it. -->
  <div id="booting" hidden><div class="card"><span>Loading</span><b id="bootingGame"></b></div></div>

  <div id="menu" class="sheet-backdrop" hidden>
    <div class="sheet settings-sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <div class="sheet-head">
        <h1 id="menuTitle">P8<span>js</span></h1>
        <button id="closeMenu" class="icon" aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <section class="sec-controls">
        <h2>Controls</h2>
        <label class="switch"><span>Left-handed<small>X and O on the left, d-pad on the right</small></span><input id="leftHanded" type="checkbox"><i></i></label>
        <label class="switch"><span>Flip X and O<small>O on top, X below. Remembered for each cart</small></span><input id="flipXO" type="checkbox"><i></i></label>
        <div class="field inline">
          <span>D-pad</span>
          <div class="seg" id="ctrlSeg">
            <button data-ctrl="8">8-way</button>
            <button data-ctrl="4">4-way</button>
          </div>
        </div>
        <label class="field slider"><span>D-pad size <output id="dpadSizeVal"></output></span>
          <input id="dpadSize" type="range" min="90" max="220" step="10"></label>
        <label class="switch" id="hapticsRow"><span>Vibrate on X and O</span><input id="haptics" type="checkbox"><i></i></label>
        <label class="switch"><span>Show zone hints</span><input id="hints" type="checkbox"><i></i></label>
        <label class="switch"><span>Show control zones<small>Outline the area for each control</small></span><input id="zones" type="checkbox"><i></i></label>
        <label class="field slider"><span>Zone opacity <output id="zoneOpacityVal"></output></span>
          <input id="zoneOpacity" type="range" min="10" max="100" step="5"></label>
        <label class="field slider"><span>Zone overlap <output id="zoneOverlapVal"></output></span>
          <input id="zoneOverlap" type="range" min="0" max="100" step="5"></label>
      </section>

      <section class="sec-sound">
        <h2>Sound</h2>
        <label class="switch"><span>Sound</span><input id="sound" type="checkbox"><i></i></label>
        <label class="field slider"><span>Volume <output id="volumeVal"></output></span>
          <input id="volume" type="range" min="0" max="100" step="5"></label>
      </section>

      <section class="sec-console">
        <h2>Cart</h2>
        <div class="row"><button id="powerBtn">Restart cart</button></div>
      </section>

    </div>
  </div>

  <div id="cartsMenu" class="sheet-backdrop" hidden>
    <div class="sheet carts-sheet" role="dialog" aria-modal="true" aria-labelledby="cartsTitle">
      <div class="sheet-head">
        <h1 id="cartsTitle">Carts</h1>
        <button id="closeCarts" class="icon" aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <section class="sec-cartridges">
        <button id="loadBtn" class="primary wide">Add cart…</button>
        <input id="romFile" type="file" accept=".p8,.png,.zip,image/png" hidden>
        <ul id="library" class="carts"></ul>
        <p id="libraryInfo" class="hint"></p>
      </section>
    </div>
  </div>

  <div id="loading" class="show" role="status" aria-live="polite">
    <div class="card">
      <div class="cart-slot"><div class="cart-chip"></div></div>
      <div class="label">Loading</div>
      <div id="loadingName" class="name">P8js</div>
    </div>
  </div>
  <div id="toast" role="status"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
